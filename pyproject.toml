[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "report-generator"
version = "0.1"
description = "Report Generator, a template renderer and pandoc wrapper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["jinja2", "python-frontmatter"]

[project.scripts]
report_generator = "report_generator.render:main"
